name: Release

# Publish a full release when a version tag is pushed, e.g. `git tag v0.1.2 && git push --tags`.
# A tag push runs five jobs end to end:
#   create-release  -> publish the GitHub Release
#   upload          -> build and attach the per-target binaries + checksums
#   publish-crate   -> `cargo publish` to crates.io (OIDC Trusted Publishing — no stored token)
#   homebrew-bump   -> bump the formula in danfry1/homebrew-tap from the release checksums
#   scoop-bump      -> bump the manifest in danfry1/scoop-bucket from the Windows checksum
#
# No long-lived tokens are stored. crates.io uses OIDC; the cross-repo pushes to the
# tap and the Scoop bucket use a GitHub App that mints a short-lived, scoped token at run time.
#
# One-time setup:
#   * crates.io Trusted Publishing: on the crate's Settings -> Trusted Publishing, add
#       Repository owner = danfry1, Repository = hacker-news-tui, Workflow = release.yml.
#     `publish-crate` then mints a short-lived token via OIDC; no CARGO_REGISTRY_TOKEN stored.
#   * A GitHub App (e.g. "danfry1 tap bumper") installed on BOTH danfry1/homebrew-tap and
#     danfry1/scoop-bucket with Repository permissions -> Contents: Read and write. Store its
#     App ID as the variable TAP_BUMP_APP_ID and its private key as the secret
#     TAP_BUMP_APP_PRIVATE_KEY on this repo. The App's token is minted per run and expires in
#     ~1 hour; only the App private key is stored, never a long-lived token.
#
# Supply-chain hardening: every action is pinned to a full commit SHA (a moving tag like
# `@v1` could be repointed at malicious code); permissions are least-privilege per job.
on:
  push:
    tags:
      - "v*"

# Default to read-only; each job opts in to exactly the scopes it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create the GitHub Release once, up front, so the matrix uploads have a
  # release to attach to (the upload action does not create one itself).
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build and upload release binary
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: hacker-news-tui
          target: ${{ matrix.target }}
          # Archive named e.g. hacker-news-tui-aarch64-apple-darwin.tar.gz (.zip on Windows).
          archive: $bin-$target
          # Emit a SHA-256 checksum alongside each archive.
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish the crate to crates.io via OIDC Trusted Publishing: the auth action
  # exchanges the job's OIDC identity for a short-lived, crate-scoped token, so
  # no long-lived registry secret is stored. Uses the committed Cargo.lock for a
  # reproducible, fully-locked publish.
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the short-lived crates.io token via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Open a pull request on danfry1/homebrew-tap that points hacker-news-tui.rb at this
  # tag's source archive. The tap's CI builds and tests bottles on that pull
  # request; publishing them is a manual `brew pr-pull` run in the tap. The
  # push and the pull request use a short-lived App token scoped to the tap.
  homebrew-formula:
    name: Open Homebrew formula PR
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mint a tap token from the GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TAP_BUMP_APP_ID }}
          private-key: ${{ secrets.TAP_BUMP_APP_PRIVATE_KEY }}
          owner: danfry1
          repositories: homebrew-tap

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danfry1/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Point the formula at this tag's source archive
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          FORMULA: hacker-news-tui
        run: |
          set -euo pipefail
          url="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl --fail --silent --show-error --location --retry 3 "$url" | sha256sum | cut -d' ' -f1)
          file="tap/${FORMULA}.rb"
          # A new version starts at revision 0, so drop any revision line.
          # Drop the bottle block: its bottles belong to the old version. Publishing
          # the tap pull request (brew pr-pull) writes a new block; if the PR is
          # merged without publishing, the formula builds from source instead of
          # pointing at bottles that do not exist.
          sed -i -E \
            -e "s#^  url \"[^\"]*\"#  url \"${url}\"#" \
            -e "s#^  sha256 \"[0-9a-f]*\"#  sha256 \"${sha}\"#" \
            -e '/^  bottle do$/,/^  end$/d' \
            -e '/^  revision [0-9]+$/d' \
            "$file"
          # Removing the block leaves two blank lines; brew style allows one.
          cat -s "$file" > "$file.new" && mv "$file.new" "$file"
          grep -qF "url \"${url}\"" "$file"
          grep -qF "sha256 \"${sha}\"" "$file"
          ! grep -q '^  bottle do$' "$file"
          cat "$file"

      - name: Push a branch and open the pull request
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          FORMULA: hacker-news-tui
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          cd tap
          if git diff --quiet; then
            echo "Formula already points at ${TAG}; nothing to do."
            exit 0
          fi
          version="${TAG#v}"
          branch="${FORMULA}-${version}"
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "${FORMULA} ${version}"
          # A re-run replaces the bot's own branch; main is never force-pushed.
          git push --force origin "$branch"
          if [ -n "$(gh pr list --repo danfry1/homebrew-tap --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "Pull request for ${branch} already open; branch updated."
            exit 0
          fi
          head_sha=$(git rev-parse HEAD)
          pr_url=$(gh pr create --repo danfry1/homebrew-tap --base main --head "$branch" \
            --title "${FORMULA} ${version}" \
            --body "Points \`${FORMULA}.rb\` at the ${TAG} source archive, opened by the ${REPO} release workflow. Publish the bottles once CI is green (do not use the merge button).")
          gh pr comment "$pr_url" --body "Publish: \`gh workflow run publish.yml -R danfry1/homebrew-tap -f pull_request=${pr_url##*/} -f head_sha=${head_sha}\`"

  # Bump the Scoop manifest in the bucket, the Windows counterpart to the
  # Homebrew job. The manifest is JSON, so jq sets the version, URL, and the
  # zip's sha256 read straight from this release's `.sha256` asset.
  scoop-bump:
    name: Bump Scoop manifest
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: read # read this release's assets; the bucket push uses the App token
    steps:
      - name: Mint a bucket token from the GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TAP_BUMP_APP_ID }}
          private-key: ${{ secrets.TAP_BUMP_APP_PRIVATE_KEY }}
          owner: danfry1
          repositories: scoop-bucket

      - name: Check out the bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          repository: danfry1/scoop-bucket
          token: ${{ steps.app-token.outputs.token }}
          path: scoop-bucket

      - name: Update the manifest from the release checksum
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base=hacker-news-tui-x86_64-pc-windows-msvc
          asset="$base.zip"
          # The checksum asset is named after the target (no archive extension),
          # e.g. hacker-news-tui-x86_64-pc-windows-msvc.sha256.
          gh release download "$TAG" --repo "$REPO" --pattern "$base.sha256" --dir shas
          hash=$(awk '{print $1}' "shas/$base.sha256")
          url="https://github.com/danfry1/hacker-news-tui/releases/download/v${version}/${asset}"

          manifest=scoop-bucket/bucket/hacker-news-tui.json
          jq --indent 4 --arg v "$version" --arg u "$url" --arg h "$hash" '
            .version = $v
            | .architecture["64bit"].url = $u
            | .architecture["64bit"].hash = $h
          ' "$manifest" > "$manifest.new"
          mv "$manifest.new" "$manifest"

          echo "--- updated manifest ---"
          cat "$manifest"

      - name: Commit and push as the App bot
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          cd scoop-bucket
          if git diff --quiet; then
            echo "Manifest already up to date; nothing to commit."
            exit 0
          fi
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "Update hacker-news-tui to ${TAG#v}"
          git push

  # Runs after every asset is on the release, in the same run that built them, and
  # signs build provenance for the published files. Kept separate from the build and
  # tap/bucket jobs so a problem here cannot fail or block an otherwise good release.
  # Verify a download with: gh attestation verify <file> --repo "$GITHUB_REPOSITORY"
  attest:
    name: Attest build provenance
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # download the release assets
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          # Only attest files that match the checksum files published with the release
          # (catches a corrupted or partly replaced asset).
          for f in *.sha256; do sha256sum -c "$f"; done
          rm -f -- *.sha256 checksums.txt SHA256SUMS
          sha256sum -- $(ls | grep -vx SHA256SUMS) > "$RUNNER_TEMP/subjects.txt"
          test -s "$RUNNER_TEMP/subjects.txt"
          cat "$RUNNER_TEMP/subjects.txt"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
