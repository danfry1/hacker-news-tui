# Weekly updates that wait 7 days after a release (cooldown), so a bad or
# hijacked version has time to be pulled before it is proposed here.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions current; one pull request for all of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
